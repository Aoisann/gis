<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Reitaku Study Abroad</title>
  <link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- スプラッシュ画像 -->
  <div id="splash">
    <div>
      <img id="splash-img" src="image2.png">
      <div class="splash-gradient-left"></div>
      <div class="splash-gradient-right"></div>
    </div>
  </div>
  <!-- ベースマップ選択（右上） -->
  <div id="basemap-box">
    <label for="basemap-select">Base Map:</label>
    <select id="basemap-select">
      <option value="carto" selected>White</option>
      <option value="dark">Dark Matter</option>
    </select>
  </div>
  <div class="filter-container">
    <div id="region-legend">
      <button class="filter-toggle" data-target="region-filters">☑</button>
      <div>Filter by Region:</div>
      <div id="region-filters">
        <label>
          <input type="checkbox" id="region-all" checked>Show All
        </label>
        <label>
          <input type="checkbox" class="region-checkbox" value="North America" checked>
          <img src="R-blue.png" class="region-icon">North America
        </label>
        <label>
          <input type="checkbox" class="region-checkbox" value="Asia" checked>
          <img src="R-purple.png" class="region-icon">Asia
        </label>
        <label>
          <input type="checkbox" class="region-checkbox" value="Europe" checked>
          <img src="R-blue2.png" class="region-icon">Europe
        </label>
        <label>
          <input type="checkbox" class="region-checkbox" value="Oceania" checked>
          <img src="R-orenge.png" class="region-icon">Oceania
        </label>
        <!-- Add Reitaku University to region filter -->
        <label>
          <input type="checkbox" class="region-checkbox" value="Reitaku University" checked>
          <img src="R透過.png" class="region-icon">Reitaku University
        </label>
      </div>
    </div>
    <div id="language-legend">
      <button class="filter-toggle" data-target="language-filters">☑</button>
      <div>Language Filter</div>
      <div id="language-filters">
        <label>
          <input type="checkbox" id="language-all" checked>全て
        </label>
        <label><input type="checkbox" class="language-checkbox" value="English" checked>英語</label>
        <label><input type="checkbox" class="language-checkbox" value="German" checked>ドイツ語</label>
        <label><input type="checkbox" class="language-checkbox" value="Chinese" checked>中国語</label>
        <label><input type="checkbox" class="language-checkbox" value="Korean" checked>韓国語</label>
        <label><input type="checkbox" class="language-checkbox" value="Other" checked>その他</label>
      </div>
    </div>
  </div>


  <div id="map"></div>
  <div id="help-btn">?</div>
  <div id="help-modal" style="display:none;">
    <div class="help-content">
      <button id="help-close">&times;</button>
      <h2>このサイトの使い方</h2>
      <ul>
        <li>地図上のピンをクリックすると大学情報が表示されます。</li>
        <li>
          <button class="univ-btn" style="pointer-events:none; background:#a6192e; color:#fff; border-radius:6px; font-size:1em; padding:2px 10px; min-width:0; border:none; margin-right:6px; vertical-align:middle;">Zoom in</button>
          ボタンで大学周辺にズームできます。
        </li>
        <li>
          <button class="univ-btn" style="pointer-events:none; background:#fff; color:#a6192e; border-radius:6px; font-size:1em; padding:2px 10px; min-width:0; border:2px solid #a6192e; margin-right:6px; vertical-align:middle;">Zoom out</button>
          ボタンで全体地図に戻ります。
        </li>
        <li>
          右上の
          <select id="basemap-select" style="pointer-events:none; background:#fff; color:#a6192e; border:2px solid #a6192e; border-radius:4px; padding:2px 8px; font-size:1em; font-family:'Times New Roman', Times, serif; font-style:italic; font-weight:bold; vertical-align:middle;">
            <option>White</option>
            <option>Dark Matter</option>
          </select>
          で地図の色を切り替えられます。
        </li>
        <li>
          左側の
          <button class="filter-toggle" style="pointer-events:none; font-size:1em; padding:2px 8px; vertical-align:middle;">☑</button>
          フィルターで地域や言語で絞り込みできます。
        </li>
        <li>
          <img src="plane1.png" alt="Flight Time" style="width:22px; height:22px; vertical-align:middle; margin-right:6px;">
          <strong style="color:#a6192e;">Flight Time</strong>は、麗澤大学からその大学まで飛行機でどれくらいかかるかの目安時間です。
        </li>
      </ul>
    </div>
  </div>
  <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
  <script src="main.js"></script>
  <script>
  document.getElementById('help-btn').onclick = function() {
    document.getElementById('help-modal').style.display = 'block';
  };
  document.getElementById('help-close').onclick = function() {
    document.getElementById('help-modal').style.display = 'none';
  };
  </script>
</body>
</html>
